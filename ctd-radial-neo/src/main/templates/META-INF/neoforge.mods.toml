license="${mod_license}"
issueTrackerURL="https://github.com/MasterGeneral156/CTD-Radial/issues" #optional

[[mods]]
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
updateJSONURL="https://raw.githubusercontent.com/MasterGeneral156/Version/refs/heads/master/ctd-radial.json" #optional
displayURL="https://www.curseforge.com/minecraft/mc-mods/ctd-radial" #optional
logoFile="ctd-radial.png" #optional
authors="${mod_authors}" #optional
description='''${mod_description}'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},]"
    ordering="NONE"
    side="BOTH"
